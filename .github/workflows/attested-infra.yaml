name: Attested Infrastructure

# From-scratch cloud footprint in the throwaway demo account, every step signed by cilock:
#   iac-scan        checkov over terraform/demo         -> sarif attestor      (CM-6, SA-11)
#   terraform-plan  plan against the live account       -> aws + git + github  (CM-3, CM-4)
#   terraform-apply apply the plan                      -> aws + git + github  (CM-2, CM-8)
#   cloud-posture   prowler over the account, ASFF out  -> asff attestor       (CA-7, RA-5, SI-4)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/attested-infra.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy"
        required: true
        default: "apply"
        type: choice
        options: [apply, destroy]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"
  TF_DIR: terraform/demo

jobs:
  infra:
    name: Terraform + posture (attested)
    runs-on: ubuntu-latest
    concurrency: cloudvault-demo-infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install checkov
        run: pipx install checkov || pip3 install --quiet checkov

      # ---- CM-6 / SA-11: IaC misconfiguration scan ----
      - name: IaC Scan (checkov)
        uses: aflock-ai/cilock-action@main
        with:
          step: iac-scan
          command: bash -c "checkov -d ${TF_DIR} -o sarif --output-file-path . --quiet || true; test -f results_sarif.sarif && mv results_sarif.sarif checkov.sarif || true"
          attestations: environment git github sarif
          product-include-glob: "checkov.sarif"

      - name: Terraform Init
        run: |
          terraform -chdir=${TF_DIR} init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudvault/demo/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # ---- CM-3 / CM-4: what will change, recorded before it changes ----
      - name: Terraform Plan
        if: ${{ github.event.inputs.action != 'destroy' }}
        uses: aflock-ai/cilock-action@main
        with:
          step: terraform-plan
          command: bash -c "terraform -chdir=${TF_DIR} plan -input=false -out=tfplan.bin && terraform -chdir=${TF_DIR} show -json tfplan.bin > ${TF_DIR}/tfplan.json"
          attestations: environment git github aws
          product-include-glob: "terraform/demo/tfplan.json"

      # ---- CM-2 / CM-8: the change itself ----
      - name: Terraform Apply
        if: ${{ github.event.inputs.action != 'destroy' }}
        uses: aflock-ai/cilock-action@main
        with:
          step: terraform-apply
          command: bash -c "terraform -chdir=${TF_DIR} apply -input=false -auto-approve tfplan.bin && terraform -chdir=${TF_DIR} output -json > ${TF_DIR}/outputs.json"
          attestations: environment git github aws
          product-include-glob: "terraform/demo/outputs.json"

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform -chdir=${TF_DIR} destroy -input=false -auto-approve

      - name: Install prowler
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: pipx install prowler==4.6.2 || pip3 install --quiet prowler==4.6.2

      # ---- CA-7 / RA-5 / SI-4: posture of the account as built ----
      - name: Cloud Posture (prowler)
        if: ${{ github.event.inputs.action != 'destroy' }}
        uses: aflock-ai/cilock-action@main
        with:
          step: cloud-posture
          command: bash -c "prowler aws --region ${AWS_REGION} -M json-asff -o prowler-out -F prowler --ignore-exit-code-3 --no-banner || true; cp prowler-out/prowler.asff.json prowler.asff.json"
          attestations: environment git github aws asff
          product-include-glob: "prowler.asff.json"
