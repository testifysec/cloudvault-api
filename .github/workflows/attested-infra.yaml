name: Attested Infrastructure

# From-scratch cloud footprint in the throwaway demo account, every step signed by cilock:
#   iac-scan        checkov over terraform/demo         -> sarif attestor      (CM-6, SA-11)
#   terraform-plan  plan against the live account       -> aws + git + github  (CM-3, CM-4)
#   terraform-apply apply the plan                      -> aws + git + github  (CM-2, CM-8)
#   cloud-posture   prowler over the account, ASFF out  -> asff attestor       (CA-7, RA-5, SI-4)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/attested-infra.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy"
        required: true
        default: "apply"
        type: choice
        options: [apply, destroy]

permissions:
  id-token: write
  contents: read

env:
  PLATFORM_URL: https://platform.testifysec.com
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"
  TF_DIR: terraform/demo

jobs:
  infra:
    name: Terraform + posture (attested)
    runs-on: ubuntu-latest
    concurrency: cloudvault-demo-infra
    steps:
      - uses: actions/checkout@v4

      - name: Install cilock (built from judge main, release cilock-2026-09-03)
        run: |
          curl -sSL -o /tmp/cilock https://github.com/testifysec/cloudvault-api/releases/download/cilock-2026-09-03/cilock-linux-amd64
          echo "464ec5650490b54561b73e087da0907360e4ceda43a7f99e7aadda28954cb7f6  /tmp/cilock" | sha256sum -c -
          install -m 0755 /tmp/cilock /usr/local/bin/cilock
          cilock version

      - name: Platform login (ambient GitHub workflow identity)
        run: cilock login --workflow-identity --platform-url "${PLATFORM_URL}" --tenant-id bb84a7e4-9ce3-434b-a0c6-d9e6e247ec16 --product-id "${{ vars.TESTIFYSEC_PRODUCT_ID }}"

      - name: Bind product
        if: ${{ vars.TESTIFYSEC_PRODUCT_ID != '' }}
        run: cilock use --product-id "${{ vars.TESTIFYSEC_PRODUCT_ID }}" --product-name cloudvault

      - name: OIDC claims (sub/aud only)
        run: |
          tok=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | sed 's/$/==/' | base64 -d 2>/dev/null | jq '{sub,aud,repository,repository_owner,repository_id,iss}'

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install checkov
        run: pipx install checkov || pip3 install --quiet checkov

      # ---- CM-6 / SA-11: IaC misconfiguration scan ----
      - name: IaC Scan (checkov)
        run: scripts/attest.sh
        env:
          STEP: iac-scan
          ATTESTATIONS: environment git github sarif
          PRODUCT_GLOB: "checkov.sarif"
          COMMAND: >-
            checkov -d ${TF_DIR} -o sarif --output-file-path . --quiet || true; test -f results_sarif.sarif && mv results_sarif.sarif checkov.sarif || true

      - name: Terraform Init
        run: |
          terraform -chdir=${TF_DIR} init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudvault/demo/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # ---- CM-3 / CM-4: what will change, recorded before it changes ----
      - name: Terraform Plan
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: scripts/attest.sh
        env:
          STEP: terraform-plan
          ATTESTATIONS: environment git github aws
          PRODUCT_GLOB: "terraform/demo/tfplan.json"
          COMMAND: >-
            terraform -chdir=${TF_DIR} plan -input=false -out=tfplan.bin && terraform -chdir=${TF_DIR} show -json tfplan.bin > ${TF_DIR}/tfplan.json

      # ---- CM-2 / CM-8: the change itself ----
      - name: Terraform Apply
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: scripts/attest.sh
        env:
          STEP: terraform-apply
          ATTESTATIONS: environment git github aws
          PRODUCT_GLOB: "terraform/demo/outputs.json"
          COMMAND: >-
            terraform -chdir=${TF_DIR} apply -input=false -auto-approve tfplan.bin && terraform -chdir=${TF_DIR} output -json > ${TF_DIR}/outputs.json

      # ---- SI-4 / CM-8: the deployed GUI answers (deployment evidence) ----
      - name: Smoke Test (deployed GUI)
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: scripts/attest.sh
        env:
          STEP: smoke-test
          ATTESTATIONS: environment git github aws
          PRODUCT_GLOB: "smoke.json"
          COMMAND: >-
            URL=$(jq -r .app_url.value ${TF_DIR}/outputs.json); for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true); [ "$code" = "200" ] && break; sleep 10; done; echo "{\"url\":\"$URL\",\"http_code\":\"$code\",\"checked_at\":\"$(date -u +%FT%TZ)\"}" | tee smoke.json; test "$code" = "200"

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform -chdir=${TF_DIR} destroy -input=false -auto-approve

      - name: Install prowler
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: pipx install prowler==4.6.2 || pip3 install --quiet prowler==4.6.2

      # ---- CA-7 / RA-5 / SI-4: posture of the account as built ----
      - name: Cloud Posture (prowler)
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: scripts/attest.sh
        env:
          STEP: cloud-posture
          ATTESTATIONS: environment git github aws asff
          PRODUCT_GLOB: "prowler.asff.json"
          COMMAND: >-
            prowler aws --region ${AWS_REGION} -M json-asff -o prowler-out -F prowler --ignore-exit-code-3 --no-banner || true; cp prowler-out/prowler.asff.json prowler.asff.json
